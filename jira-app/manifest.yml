modules:
  jira:uiModifications:
    - key: intake-checks
      title: MAOP ticket intake checks
      resource: uim
      resolver:
        function: uim-resolver
  jira:adminPage:
    - key: intake-admin
      title: MAOP ticket intake
      resource: admin
      render: native
      resolver:
        function: admin-resolver
  trigger:
    - key: issue-created
      function: issue-created-fn
      events:
        - avi:jira:created:issue
  function:
    - key: issue-created-fn
      handler: created.handler
    - key: uim-resolver
      handler: uim.handler
    - key: admin-resolver
      handler: admin.handler
resources:
  - key: uim
    path: static/uim/dist
  - key: admin
    path: src/frontend/admin.tsx
permissions:
  scopes:
    - read:jira-user
    - read:jira-work
    - write:jira-work
    - manage:jira-configuration
    - manage:jira-project
  external:
    fetch:
      backend:
        - address: "*.trycloudflare.com"
        - address: "*.workers.dev"
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/93f41063-4ce7-48dc-ac53-6660cf0214ae
