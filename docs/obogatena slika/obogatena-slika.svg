<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',sans-serif" font-size="18" fill="#222">
  <title>Obogatena slika: obravnava zahtevkov v podjetju MAOP (sedanje stanje)</title>
  <defs>
    <marker id="a-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c0262d"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c2620a"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1d5fa8"/></marker>

    <!-- stick figure, head centre at 0,0, feet at y=135 -->
    <g id="person" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="20" fill="#fff"/>
      <path d="M0 20 L0 85 M-32 50 L0 38 L32 50 M0 85 L-24 135 M0 85 L24 135"/>
      <circle cx="-7" cy="-4" r="1.8" fill="#222" stroke="none"/>
      <circle cx="7" cy="-4" r="1.8" fill="#222" stroke="none"/>
    </g>
    <path id="sad" d="M-8 11 Q0 4 8 11" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <path id="flat" d="M-7 9 L7 9" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
    <!-- tie for the owner -->
    <path id="tie" d="M0 22 L-5 30 L0 55 L5 30 Z" fill="#1d5fa8"/>

    <!-- crossed swords = conflict -->
    <g id="swords" fill="none" stroke="#c0262d" stroke-width="4" stroke-linecap="round">
      <path d="M-28 -28 L14 14 M6 22 L22 6 M14 14 L26 26"/>
      <path d="M28 -28 L-14 14 M-6 22 L-22 6 M-14 14 L-26 26"/>
    </g>
    <!-- hourglass = waiting -->
    <g id="hourglass" stroke="#c2620a" stroke-width="3" stroke-linejoin="round">
      <path d="M-20 -30 H20 M-20 30 H20" fill="none"/>
      <path d="M-16 -30 L0 0 L16 -30 Z" fill="#fde7c4"/>
      <path d="M-16 30 L0 0 L16 30 Z" fill="#f6b25e"/>
    </g>
    <!-- clock -->
    <g id="clock" fill="#fff" stroke="#c0262d" stroke-width="3" stroke-linecap="round">
      <circle r="24"/>
      <path d="M0 0 L0 -15 M0 0 L11 6" fill="none"/>
    </g>
    <!-- ticket paper -->
    <g id="paper" stroke="#222" stroke-width="2" fill="#fffdf3">
      <path d="M0 0 H36 L46 10 V56 H0 Z"/>
      <path d="M36 0 V10 H46" fill="none"/>
      <path d="M7 20 H38 M7 30 H34 M7 40 H28" stroke="#999"/>
    </g>
  </defs>

  <rect width="1600" height="1060" fill="#fff"/>

  <!-- title -->
  <text x="800" y="46" text-anchor="middle" font-size="30" font-weight="bold">Obravnava zahtevkov v podjetju MAOP</text>
  <text x="800" y="78" text-anchor="middle" font-size="18" fill="#555">Obogatena slika sedanjega stanja · problem: zahtevki prispejo s premalo informacijami, obravnava traja predolgo</text>

  <!-- company context -->
  <g>
    <rect x="30" y="110" width="330" height="140" rx="14" fill="#f3f4f6" stroke="#555" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="48" y="140" font-weight="bold">Podjetje MAOP</text>
    <text x="48" y="168" font-size="16">32 zaposlenih, 6,99 M € prihodkov (2025)</text>
    <text x="48" y="192" font-size="16">razvoj, uvajanje in podpora IS</text>
    <text x="48" y="216" font-size="16">kupci: podjetja in javni sektor (B2B)</text>
    <text x="48" y="240" font-size="16">orodje za zahtevke: Jira</text>
  </g>

  <!-- owner -->
  <g>
    <use href="#person" x="800" y="150"/>
    <use href="#flat" x="800" y="150"/>
    <use href="#tie" x="800" y="150"/>
    <text x="800" y="314" text-anchor="middle" font-weight="bold">Pavel Ilija</text>
    <text x="800" y="336" text-anchor="middle" font-size="16">delni lastnik, naročnik</text>
    <!-- thought -->
    <rect x="410" y="104" width="340" height="128" rx="40" fill="#eef5ff" stroke="#1d5fa8" stroke-width="2.5"/>
    <circle cx="757" cy="226" r="8" fill="#eef5ff" stroke="#1d5fa8" stroke-width="2.5"/>
    <circle cx="772" cy="240" r="5" fill="#eef5ff" stroke="#1d5fa8" stroke-width="2.5"/>
    <text x="580" y="140" text-anchor="middle" font-size="17">»Obravnava zahtevkov traja</text>
    <text x="580" y="162" text-anchor="middle" font-size="17">predolgo. Želim manj dodatnih</text>
    <text x="580" y="184" text-anchor="middle" font-size="17">vprašanj in zahtevek takoj</text>
    <text x="580" y="206" text-anchor="middle" font-size="17">v pravem oddelku.«</text>
  </g>

  <!-- submitter -->
  <g>
    <rect x="40" y="290" width="330" height="110" rx="40" fill="#fff6f6" stroke="#c0262d" stroke-width="2.5"/>
    <circle cx="170" cy="410" r="8" fill="#fff6f6" stroke="#c0262d" stroke-width="2.5"/>
    <circle cx="178" cy="428" r="5" fill="#fff6f6" stroke="#c0262d" stroke-width="2.5"/>
    <text x="205" y="326" text-anchor="middle" font-size="17">»Saj sem napisal, da ne dela.</text>
    <text x="205" y="348" text-anchor="middle" font-size="17">Kaj sploh potrebujejo?</text>
    <text x="205" y="370" text-anchor="middle" font-size="17">Zakaj me spet sprašujejo?«</text>
    <use href="#person" x="185" y="470"/>
    <use href="#sad" x="185" y="470"/>
    <text x="185" y="632" text-anchor="middle" font-weight="bold">Oddajnik zahtevka</text>
    <text x="185" y="654" text-anchor="middle" font-size="16">zaposleni (IT ali inženiring)</text>
  </g>

  <!-- the ticket -->
  <g>
    <g transform="translate(262 452) rotate(-6)">
      <rect width="196" height="72" rx="6" fill="#fffdf3" stroke="#222" stroke-width="2"/>
      <text x="98" y="44" text-anchor="middle" font-size="17">»Program mi ne dela.«</text>
    </g>
    <text x="262" y="560" font-size="16" fill="#c0262d">manjka: kateri program?</text>
    <text x="262" y="582" font-size="16" fill="#c0262d">verzija? modul? napaka?</text>
    <text x="262" y="604" font-size="16" fill="#c0262d">koraki? od kdaj?</text>
  </g>

  <!-- 1 submit -->
  <path d="M466 500 L660 500" stroke="#222" stroke-width="3" fill="none" marker-end="url(#a-black)"/>
  <text x="563" y="486" text-anchor="middle" font-size="17"><tspan font-weight="bold">1</tspan> oddaja zahtevka</text>
  <text x="563" y="528" text-anchor="middle" font-size="15" fill="#555">prosto besedilo</text>

  <!-- Jira -->
  <g>
    <rect x="670" y="420" width="260" height="170" rx="22" fill="#eef5ff" stroke="#1d5fa8" stroke-width="3"/>
    <text x="800" y="456" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d5fa8">Jira</text>
    <text x="800" y="480" text-anchor="middle" font-size="15" fill="#1d5fa8">obstoječe orodje za zahtevke</text>
    <use href="#paper" x="722" y="500"/>
    <use href="#paper" x="742" y="506"/>
    <use href="#paper" x="762" y="512"/>
    <text x="800" y="618" text-anchor="middle" font-size="15" fill="#555">nič ne preveri, ali je</text>
    <text x="800" y="638" text-anchor="middle" font-size="15" fill="#555">zahtevek popoln</text>
  </g>

  <!-- routing -->
  <path d="M935 470 L1175 395" stroke="#1d5fa8" stroke-width="3" fill="none" marker-end="url(#a-blue)"/>
  <path d="M935 545 L1175 715" stroke="#1d5fa8" stroke-width="3" fill="none" marker-end="url(#a-blue)"/>
  <text x="1040" y="410" text-anchor="middle" font-size="16" fill="#1d5fa8">usmeritev</text>
  <text x="1040" y="660" text-anchor="middle" font-size="16" fill="#1d5fa8">usmeritev</text>

  <!-- receivers' thought -->
  <g>
    <rect x="1090" y="104" width="470" height="134" rx="42" fill="#fff6f6" stroke="#c0262d" stroke-width="2.5"/>
    <circle cx="1250" cy="248" r="8" fill="#fff6f6" stroke="#c0262d" stroke-width="2.5"/>
    <circle cx="1244" cy="266" r="5" fill="#fff6f6" stroke="#c0262d" stroke-width="2.5"/>
    <text x="1325" y="140" text-anchor="middle" font-size="17"><tspan font-weight="bold">2</tspan> »Kateri program? Katera verzija?</text>
    <text x="1325" y="164" text-anchor="middle" font-size="17">Kaj točno se zgodi? Je kakšno</text>
    <text x="1325" y="188" text-anchor="middle" font-size="17">sporočilo o napaki? Brez tega</text>
    <text x="1325" y="212" text-anchor="middle" font-size="17">ne morem začeti.«</text>
  </g>

  <!-- IT department -->
  <g>
    <rect x="1180" y="290" width="380" height="200" rx="16" fill="#fafafa" stroke="#222" stroke-width="2.5"/>
    <use href="#person" x="1245" y="330"/>
    <use href="#sad" x="1245" y="330"/>
    <text x="1300" y="330" font-size="21" font-weight="bold">IT oddelek</text>
    <text x="1300" y="354" font-size="15" fill="#555">notranja podpora</text>
    <text x="1300" y="392" font-size="15">potrebuje:</text>
    <text x="1300" y="414" font-size="15">napravo ali storitev,</text>
    <text x="1300" y="436" font-size="15">sporočilo o napaki,</text>
    <text x="1300" y="458" font-size="15">od kdaj težava traja</text>
  </g>

  <!-- engineering department -->
  <g>
    <rect x="1180" y="620" width="380" height="200" rx="16" fill="#fafafa" stroke="#222" stroke-width="2.5"/>
    <use href="#person" x="1245" y="660"/>
    <use href="#sad" x="1245" y="660"/>
    <text x="1300" y="660" font-size="21" font-weight="bold">Inženirski oddelek</text>
    <text x="1300" y="684" font-size="15" fill="#555">programi MAOP</text>
    <text x="1300" y="722" font-size="15">potrebuje:</text>
    <text x="1300" y="744" font-size="15">program, verzijo, modul,</text>
    <text x="1300" y="766" font-size="15">korake za ponovitev,</text>
    <text x="1300" y="788" font-size="15">sporočilo o napaki</text>
  </g>

  <!-- wrong department ping-pong -->
  <path d="M1140 500 L1140 610" stroke="#c0262d" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-start="url(#a-red)" marker-end="url(#a-red)"/>
  <use href="#swords" x="1100" y="555"/>
  <text x="1162" y="548" font-size="15" fill="#c0262d">ni takoj v pravem oddelku</text>
  <text x="1162" y="570" font-size="15" fill="#c0262d">→ prestavljanje med oddelkoma</text>

  <!-- 3 questions back -->
  <path d="M1175 800 C1000 990 460 990 215 672" stroke="#c0262d" stroke-width="3.5" fill="none" marker-end="url(#a-red)"/>
  <text x="760" y="968" text-anchor="middle" font-size="18" fill="#c0262d"><tspan font-weight="bold">3</tspan> dodatna vprašanja nazaj k oddajniku</text>

  <!-- 4 waiting for answer -->
  <path d="M300 660 C470 860 960 870 1175 770" stroke="#c2620a" stroke-width="3" stroke-dasharray="10 7" fill="none" marker-end="url(#a-orange)"/>
  <text x="760" y="872" text-anchor="middle" font-size="18" fill="#c2620a"><tspan font-weight="bold">4</tspan> čakanje na odgovor</text>
  <use href="#hourglass" x="590" y="840"/>
  <use href="#clock" x="930" y="842"/>

  <!-- conflict between submitter and receiver -->
  <use href="#swords" x="500" y="828"/>
  <text x="545" y="732" text-anchor="middle" font-size="15" fill="#c0262d">frustracija na</text>
  <text x="545" y="750" text-anchor="middle" font-size="15" fill="#c0262d">obeh straneh</text>

  <!-- 5 only then solving -->
  <text x="1370" y="852" text-anchor="middle" font-size="17"><tspan font-weight="bold">5</tspan> šele nato reševanje</text>

  <!-- lost time -->
  <g>
    <rect x="600" y="990" width="400" height="52" rx="26" fill="#c0262d"/>
    <text x="800" y="1023" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">koraki 2–4 = izgubljen čas</text>
  </g>

  <!-- customers (assumption) -->
  <g opacity="0.85">
    <g transform="translate(1410 905) scale(0.55)"><use href="#person"/><use href="#flat"/></g>
    <g transform="translate(1470 905) scale(0.55)"><use href="#person"/><use href="#flat"/></g>
    <text x="1440" y="1005" text-anchor="middle" font-size="15">kupci MAOP</text>
    <text x="1440" y="1025" text-anchor="middle" font-size="15">»Kdaj bo rešeno?«</text>
    <path d="M1370 905 L1370 870" stroke="#555" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#a-black)"/>
    <text x="1355" y="935" text-anchor="end" font-size="14" fill="#555">posredno?</text>
  </g>

  <!-- legend -->
  <g font-size="14">
    <rect x="30" y="860" width="310" height="186" rx="10" fill="#fff" stroke="#999" stroke-width="1.5"/>
    <text x="44" y="884" font-weight="bold" font-size="15">Legenda</text>
    <rect x="44" y="896" width="34" height="20" rx="10" fill="#fff6f6" stroke="#c0262d" stroke-width="2"/>
    <text x="88" y="911">misel, skrb deležnika</text>
    <g transform="translate(61 941) scale(0.45)"><use href="#swords"/></g>
    <text x="88" y="946">konflikt, napetost</text>
    <g transform="translate(61 974) scale(0.45)"><use href="#hourglass"/></g>
    <text x="88" y="979">čakanje, izgubljen čas</text>
    <text x="44" y="1012" fill="#c0262d">rdeče</text>
    <text x="88" y="1012">težava, manjkajoči podatek</text>
    <path d="M44 1032 H78" stroke="#555" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="88" y="1037">predpostavka, potrdimo</text>
  </g>
</svg>
